name: Auto Update Prices

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check
      uses: actions/checkout@v3

    - name: Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Tools
      run: |
        pip install requests beautifulsoup4

    - name: Script
      run: |
        echo 'import json, requests' > get.py
        echo 'from bs4 import BeautifulSoup' >> get.py
        echo 'from datetime import datetime' >> get.py
        echo 'url = "https://sarf-today.com/"' >> get.py
        echo 'head = {"User-Agent": "Mozilla/5.0"}' >> get.py
        echo 'b_usd, s_usd, b_try, s_try = "14800", "15000", "430", "445"' >> get.py
        echo 'try:' >> get.py
        echo '    res = requests.get(url, headers=head, timeout=15)' >> get.py
        echo '    if res.status_code == 200:' >> get.py
        echo '        soup = BeautifulSoup(res.text, "html.parser")' >> get.py
        echo '        b_usd = soup.find("span", {"id": "usd_buy"}).text.strip()' >> get.py
        echo '        s_usd = soup.find("span", {"id": "usd_sell"}).text.strip()' >> get.py
        echo '        b_try = soup.find("span", {"id": "try_buy"}).text.strip()' >> get.py
        echo '        s_try = soup.find("span", {"id": "try_sell"}).text.strip()' >> get.py
        echo 'except: pass' >> get.py
        echo 'g_try = "33.50"' >> get.py
        echo 'try:' >> get.py
        echo '    api = requests.get("https://open.er-api.com/v6/latest/USD", timeout=10).json()' >> get.py
        echo '    g_try = str(round(api["rates"]["TRY"], 2))' >> get.py
        echo 'except: pass' >> get.py
        echo 'out = {"last_update": datetime.now().strftime("%Y-%m-%d %H:%M:%S"), "currency": {"USD_TO_SYP": {"buy": b_usd, "sell": s_usd}, "TRY_TO_SYP": {"buy": b_try, "sell": s_try}, "USD_TO_TRY": {"global_rate": g_try}}}' >> get.py
        echo 'with open("prices.json", "w", encoding="utf-8") as f: json.dump(out, f, ensure_ascii=False, indent=4)' >> get.py

    - name: Run
      run: python get.py

    - name: Push
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        git add prices.json
        git commit -m "🔄 Update Prices" && git push || echo "No changes"
