name: تحديث أسعار الصرف
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: جلب ورفع الأسعار
        env:
          BIN_ID: ${{ secrets.BIN_ID }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          python3 << 'EOF'
          import urllib.request, json, os, time
          BIN_ID = os.environ["BIN_ID"]
          API_KEY = os.environ["API_KEY"]
          JSONBIN = "https://api.jsonbin.io/v3/b/" + BIN_ID
          def get(url):
            req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
            with urllib.request.urlopen(req, timeout=15) as r:
              return json.loads(r.read())
          sell = None
          try:
            d = get("https://open.er-api.com/v6/latest/USD")
            sell = round(d["rates"]["SYP"])
            buy = round(sell * 0.985)
            print("sell=" + str(sell))
          except Exception as e:
            print("er-api failed: " + str(e))
          if not sell:
            try:
              d = get("https://api.frankfurter.app/latest?from=USD&to=SYP")
              sell = round(d["rates"]["SYP"])
              buy = round(sell * 0.985)
              print("frankfurter sell=" + str(sell))
            except Exception as e:
              print("frankfurter failed: " + str(e))
          if not sell:
            raise Exception("all sources failed")
          try:
            tr = get("https://open.er-api.com/v6/latest/USD")["rates"]["TRY"]
          except:
            tr = 38.5
          now = time.gmtime(time.time() + 3 * 3600)
          days = ["الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت","الأحد"]
          months = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"]
          h = {"X-Master-Key": API_KEY}
          req = urllib.request.Request(JSONBIN + "/latest", headers=h)
          with urllib.request.urlopen(req, timeout=15) as r:
            cur = json.loads(r.read())["record"]
          cur["newSyp"] = round((sell / 100) * 10) / 10
          cur["oldSyp"] = sell
          cur["tryRate"] = round(tr * 100) / 100
          cur["trySyp"] = round((sell / tr / 100) * 100) / 100
          cur["buySyp"] = buy
          cur["buyNewSyp"] = round((buy / 100) * 10) / 10
          cur["dateStr"] = days[now.tm_wday] + " " + str(now.tm_mday) + " " + months[now.tm_mon - 1] + " " + str(now.tm_year)
          cur["timeStr"] = str(now.tm_hour).zfill(2) + ":" + str(now.tm_min).zfill(2)
          cur["source"] = "github-actions"
          cur["updatedAt"] = int(time.time() * 1000)
          body = json.dumps(cur).encode()
          req = urllib.request.Request(JSONBIN, data=body, method="PUT", headers={"Content-Type": "application/json", "X-Master-Key": API_KEY})
          with urllib.request.urlopen(req, timeout=15) as r:
            print("done: " + str(r.status))
          EOF
