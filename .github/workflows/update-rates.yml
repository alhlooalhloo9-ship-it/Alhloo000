name: تحديث أسعار الصرف والذهب من ليرتنا

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rates:
    runs-on: ubuntu-latest
    steps:
      - name: تنزيل المشروع
        uses: actions/checkout@v4
      - name: إعداد Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: تثبيت المكتبات
        run: pip install requests beautifulsoup4
      - name: استخراج أسعار ليرتنا والتحقق منها
        run: |
          cat > update_rates.py <<'PY'
          import json, re
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import requests
          from bs4 import BeautifulSoup

          URL = "https://lirtna.com/"
          HEADERS = {"User-Agent": "Mozilla/5.0 AlhlooShippingRates/1.0"}
          response = requests.get(URL, headers=HEADERS, timeout=30)
          response.raise_for_status()
          soup = BeautifulSoup(response.text, "html.parser")

          def norm(s):
              return re.sub(r"\s+", " ", s).strip().lower()
          def nums(s):
              s = s.translate(str.maketrans("٠١٢٣٤٥٦٧٨٩۰۱۲۳۴۵۶۷۸۹", "01234567890123456789"))
              s = s.replace(",", "").replace("٬", "").replace("٫", ".")
              return [float(x) for x in re.findall(r"\d+(?:\.\d+)?", s)]
          rows=[]
          for table in soup.find_all("table"):
              for tr in table.find_all("tr"):
                  cells=[c.get_text(" ",strip=True) for c in tr.find_all(["th","td"])]
                  if cells: rows.append(cells)

          usd=try_rate=None
          gold={}
          for cells in rows:
              label=norm(cells[0])
              if len(cells)>=3:
                  sell_nums=nums(cells[1]); buy_nums=nums(cells[2])
                  if sell_nums and buy_nums:
                      sell,buy=sell_nums[0],buy_nums[0]
                      if label in ("دولار ($)", "دولار", "usd", "us dollar", "الدولار الأمريكي", "الدولار الامريكي", "الدولار الأميركي", "الدولار الاميركي"):
                          usd={"sell":sell,"buy":buy}
                      elif label in ("ليرة تركية (try)", "ليرة تركية", "try", "تركية"):
                          try_rate={"sell":sell,"buy":buy}
              if "غرام عيار 24" in label or "عيار 24" in label:
                  values=nums(" ".join(cells[1:]))
                  if values: gold["gold24Syp"]=values[0]
              elif "غرام عيار 21" in label or "عيار 21" in label:
                  values=nums(" ".join(cells[1:]))
                  if values: gold["gold21Syp"]=values[0]
              elif "غرام عيار 18" in label or "عيار 18" in label:
                  values=nums(" ".join(cells[1:]))
                  if values: gold["gold18Syp"]=values[0]
              elif "أونصة الذهب" in label or "اونصة الذهب" in label:
                  values=nums(" ".join(cells[1:]))
                  if values: gold["goldOzUsd"]=values[0]

          if not usd or not try_rate:
              raise RuntimeError("لم يتم التعرف بثقة على صفّي الدولار والليرة التركية في جداول ليرتنا؛ لن نغيّر الملف.")
          if not (50 <= usd["buy"] <= 1000 and 50 <= usd["sell"] <= 1000 and usd["sell"] >= usd["buy"]):
              raise RuntimeError(f"سعر الدولار غير منطقي/ربما تمت قراءة الليرة القديمة: {usd}")
          if not (0.1 <= try_rate["buy"] <= 20 and 0.1 <= try_rate["sell"] <= 20 and try_rate["sell"] >= try_rate["buy"]):
              raise RuntimeError(f"سعر الليرة التركية غير منطقي: {try_rate}")
          if not gold.get("gold24Syp") or not gold.get("goldOzUsd"):
              raise RuntimeError(f"تعذر قراءة أسعار الذهب 24 عيار/الأونصة من ليرتنا: {gold}; لم يتم نشر تحديث جزئي.")

          now=datetime.now(ZoneInfo("Asia/Damascus"))
          data={
            "last_update":now.strftime("%Y-%m-%d %H:%M:%S"),
            "dateStr":now.strftime("%Y-%m-%d"),
            "timeStr":now.strftime("%H:%M"),
            "tgUpdatedAt":int(now.timestamp()*1000),
            "source":"Lirtna",
            "sourceUrl":URL,
            "newSyp":usd["sell"],
            "oldSyp":round(usd["sell"]*100,2),
            "buyNewSyp":usd["buy"],
            "buySyp":round(usd["buy"]*100,2),
            "trySyp":try_rate["sell"],
            "tryBuySyp":try_rate["buy"],
            "tryRate":round(usd["sell"]/try_rate["sell"],4),
            **gold
          }
          with open("prices.json","w",encoding="utf-8") as f: json.dump(data,f,ensure_ascii=False,indent=2)
          print(json.dumps(data,ensure_ascii=False,indent=2))
          PY
          python update_rates.py
      - name: حفظ الأسعار الجديدة
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet && exit 0
          git commit -m "تحديث أسعار الصرف والذهب من ليرتنا"
          git push
