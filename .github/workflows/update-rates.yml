name: تحديث أسعار الصرف من ليرتنا

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rates:
    runs-on: ubuntu-latest
    steps:
      - name: تنزيل المشروع
        uses: actions/checkout@v4

      - name: إعداد Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: تثبيت المكتبات
        run: pip install requests beautifulsoup4

      - name: جلب الأسعار من ليرتنا وتحديث prices.json
        run: |
          cat > update_rates.py <<'PY'
          import json
          import re
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import requests
          from bs4 import BeautifulSoup

          HEADERS = {"User-Agent": "Mozilla/5.0 (compatible; AlhlooShippingRates/1.0)"}
          TIMEOUT = 20

          def number(value):
              value = value.replace(",", "").replace("٬", "").replace("٫", ".").strip()
              match = re.search(r"\d+(?:\.\d+)?", value)
              return float(match.group(0)) if match else None

          def read_rate(url, keywords):
              response = requests.get(url, headers=HEADERS, timeout=TIMEOUT)
              response.raise_for_status()
              soup = BeautifulSoup(response.text, "html.parser")
              for row in soup.find_all("tr"):
                  cells = [cell.get_text(" ", strip=True) for cell in row.find_all(["td", "th"])]
                  if len(cells) < 3:
                      continue
                  label = " ".join(cells[0].lower().split())
                  if all(word.lower() in label for word in keywords):
                      sell = number(cells[1])
                      buy = number(cells[2])
                      if sell and buy:
                          return {"buy": buy, "sell": sell}
              raise RuntimeError("لم يتم العثور على السعر المطلوب في " + url)

          # أسعار السوق في دمشق من موقع ليرتنا
          usd = read_rate("https://lirtna.com/currency/us-dollar", ["دولار", "دمشق"])
          try_rate_syp = read_rate("https://lirtna.com/currency/turkish-lira", ["ليرة تركية", "دمشق"])

          # سعر الدولار مقابل الليرة التركية عالميًا، مع بديل احتياطي إذا تعذر المصدر
          usd_try = None
          try:
              api = requests.get("https://open.er-api.com/v6/latest/USD", timeout=TIMEOUT).json()
              usd_try = float(api["rates"]["TRY"])
          except Exception:
              pass

          now = datetime.now(ZoneInfo("Asia/Damascus"))
          output = {
              "last_update": now.strftime("%Y-%m-%d %H:%M:%S"),
              "dateStr": now.strftime("%Y-%m-%d"),
              "timeStr": now.strftime("%H:%M"),
              "tgUpdatedAt": int(now.timestamp() * 1000),
              "source": "Lirtna",
              "sourceUrl": "https://lirtna.com/",
              "newSyp": usd["sell"],
              "oldSyp": round(usd["sell"] * 100, 2),
              "buyNewSyp": usd["buy"],
              "buySyp": round(usd["buy"] * 100, 2),
              "trySyp": try_rate_syp["sell"],
              "tryBuySyp": try_rate_syp["buy"],
              "tryRate": round(usd_try, 4) if usd_try else 49.65
          }
          with open("prices.json", "w", encoding="utf-8") as file:
              json.dump(output, file, ensure_ascii=False, indent=2)
          print(json.dumps(output, ensure_ascii=False, indent=2))
          PY
          python update_rates.py

      - name: حفظ الأسعار في GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git commit -m "تحديث أسعار الصرف من ليرتنا" || exit 0
          git push
