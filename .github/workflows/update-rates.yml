name: تحديث أسعار الصرف من ليرتنا

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rates:
    runs-on: ubuntu-latest
    steps:
      - name: تنزيل المشروع
        uses: actions/checkout@v4

      - name: إعداد Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: تثبيت المكتبات
        run: pip install requests beautifulsoup4

      - name: قراءة أسعار ليرتنا وتحديث الملف
        run: |
          cat > update_rates.py <<'PY'
          import json, re
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import requests
          from bs4 import BeautifulSoup

          url = "https://lirtna.com/"
          headers = {"User-Agent": "Mozilla/5.0 (compatible; AlhlooShippingRates/1.0)"}
          response = requests.get(url, headers=headers, timeout=25)
          response.raise_for_status()
          soup = BeautifulSoup(response.text, "html.parser")

          def num(text):
              text = text.replace(",", "").replace("٬", "").replace("٫", ".")
              match = re.search(r"\d+(?:\.\d+)?", text)
              return float(match.group()) if match else None

          found = {}
          for row in soup.find_all("tr"):
              cells = [cell.get_text(" ", strip=True) for cell in row.find_all(["td", "th"])]
              if len(cells) < 3:
                  continue
              label = cells[0].lower()
              sell, buy = num(cells[1]), num(cells[2])
              if not sell or not buy:
                  continue
              if "دولار" in label or "dollar" in label:
                  found["usd"] = {"buy": buy, "sell": sell}
              elif "ليرة تركية" in label or "turkish lira" in label:
                  found["try"] = {"buy": buy, "sell": sell}

          if "usd" not in found or "try" not in found:
              raise RuntimeError("لم نستطع قراءة سعري الدولار والليرة التركية من ليرتنا؛ لن نكتب أسعاراً تقديرية.")

          now = datetime.now(ZoneInfo("Asia/Damascus"))
          usd, tr = found["usd"], found["try"]
          output = {
              "last_update": now.strftime("%Y-%m-%d %H:%M:%S"),
              "dateStr": now.strftime("%Y-%m-%d"),
              "timeStr": now.strftime("%H:%M"),
              "tgUpdatedAt": int(now.timestamp() * 1000),
              "source": "Lirtna",
              "sourceUrl": url,
              "newSyp": usd["sell"],
              "oldSyp": round(usd["sell"] * 100, 2),
              "buyNewSyp": usd["buy"],
              "buySyp": round(usd["buy"] * 100, 2),
              "trySyp": tr["sell"],
              "tryBuySyp": tr["buy"],
              "tryRate": round(usd["sell"] / tr["sell"], 4)
          }
          with open("prices.json", "w", encoding="utf-8") as file:
              json.dump(output, file, ensure_ascii=False, indent=2)
          print(json.dumps(output, ensure_ascii=False, indent=2))
          PY
          python update_rates.py

      - name: حفظ الأسعار في GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git commit -m "تحديث أسعار الصرف من ليرتنا" || exit 0
          git push
