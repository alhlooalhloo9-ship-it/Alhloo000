name: تحديث أسعار الصرف من موقع الليرة اليوم

on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rates:
    runs-on: ubuntu-latest
    steps:
      - name: تنزيل المشروع
        uses: actions/checkout@v4

      - name: إعداد Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: تثبيت المكتبات
        run: pip install requests beautifulsoup4

      - name: قراءة الأسعار من موقع الليرة اليوم
        run: |
          cat > update_rates.py <<'PY'
          import json, re
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import requests
          from bs4 import BeautifulSoup

          url = "https://sp-today.com/currencies"
          headers = {"User-Agent": "Mozilla/5.0 (compatible; AlhlooShippingRates/1.0)"}
          response = requests.get(url, headers=headers, timeout=30)
          response.raise_for_status()
          soup = BeautifulSoup(response.text, "html.parser")

          def norm(s):
              return re.sub(r"\\s+", " ", s).strip().lower()

          def number(s):
              s = s.translate(str.maketrans("٠١٢٣٤٥٦٧٨٩۰۱۲۳۴۵۶۷۸۹", "01234567890123456789"))
              s = s.replace(",", "").replace("٬", "").replace("٫", ".")
              m = re.search(r"(?<![A-Za-z])\\d+(?:\\.\\d+)?", s)
              return float(m.group()) if m else None

          rates = {}
          for table in soup.find_all("table"):
              rows = table.find_all("tr")
              if len(rows) < 2:
                  continue
              headers_row = rows[0].find_all(["th", "td"])
              headers = [norm(c.get_text(" ", strip=True)) for c in headers_row]
              buy_idx = next((i for i,h in enumerate(headers) if "شراء" in h or h == "buy"), None)
              sell_idx = next((i for i,h in enumerate(headers) if "مبيع" in h or "بيع" in h or h == "sell"), None)
              if buy_idx is None or sell_idx is None:
                  continue
              for row in rows[1:]:
                  cells = row.find_all(["td", "th"])
                  if len(cells) <= max(buy_idx, sell_idx):
                      continue
                  label = norm(cells[0].get_text(" ", strip=True))
                  buy = number(cells[buy_idx].get_text(" ", strip=True))
                  sell = number(cells[sell_idx].get_text(" ", strip=True))
                  if buy is None or sell is None:
                      continue
                  if "usd" in label or "دولار أمريكي" in label or "دولار" in label:
                      rates["usd"] = {"buy": buy, "sell": sell}
                  elif "try" in label or "ليرة تركية" in label or "تركية" in label:
                      rates["try"] = {"buy": buy, "sell": sell}

          if "usd" not in rates or "try" not in rates:
              # Some site layouts may place labels and values outside standard tables.
              raise RuntimeError("لم نستطع تحديد أسعار شراء ومبيع الدولار والليرة التركية من جدول موقع الليرة اليوم؛ لم يتم تغيير prices.json.")

          usd, tr = rates["usd"], rates["try"]
          if not (100 <= usd["buy"] <= 100000 and 100 <= usd["sell"] <= 100000 and 0.1 <= tr["buy"] <= 1000 and 0.1 <= tr["sell"] <= 1000):
              raise RuntimeError("الأسعار المستخرجة خارج النطاق المتوقع؛ لن يتم نشرها.")

          now = datetime.now(ZoneInfo("Asia/Damascus"))
          output = {
              "last_update": now.strftime("%Y-%m-%d %H:%M:%S"),
              "dateStr": now.strftime("%Y-%m-%d"),
              "timeStr": now.strftime("%H:%M"),
              "tgUpdatedAt": int(now.timestamp() * 1000),
              "source": "SP-Today",
              "sourceUrl": url,
              "newSyp": usd["sell"],
              "oldSyp": round(usd["sell"] * 100, 2),
              "buyNewSyp": usd["buy"],
              "buySyp": round(usd["buy"] * 100, 2),
              "trySyp": tr["sell"],
              "tryBuySyp": tr["buy"],
              "tryRate": round(usd["sell"] / tr["sell"], 4)
          }
          with open("prices.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)
          print("Validated rates from SP-Today:")
          print(json.dumps(output, ensure_ascii=False, indent=2))
          PY
          python update_rates.py

      - name: حفظ الأسعار في GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git commit -m "تحديث أسعار الصرف من موقع الليرة اليوم" || exit 0
          git push
