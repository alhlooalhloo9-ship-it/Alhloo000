name: تحديث أسعار الصرف
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: جلب ورفع الأسعار
        env:
          BIN_ID: ${{ secrets.BIN_ID }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          python3 << 'PYTHON'
          import urllib.request, json, os, time

          BIN_ID=os.environ['BIN_ID']
          API_KEY=os.environ['API_KEY']
          JSONBIN=f'https://api.jsonbin.io/v3/b/{BIN_ID}'

          def fetch(url):
            r=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
            with urllib.request.urlopen(r,timeout=15) as x:
              return json.loads(x.read())

          # سعر الدولار مقابل الليرة السورية
          sell,buy = None,None
          try:
            d=fetch('https://open.er-api.com/v6/latest/USD')
            sell=round(d['rates']['SYP'])
            buy=round(sell*0.985)
            print(f'open.er-api: sell={sell}')
          except: pass

          if not sell:
            try:
              d=fetch('https://api.frankfurter.app/latest?from=USD&to=SYP')
              sell=round(d['rates']['SYP'])
              buy=round(sell*0.985)
              print(f'frankfurter: sell={sell}')
            except: pass

          if not sell: raise Exception('فشل جلب سعر الليرة السورية')

          # سعر الليرة التركية
          try:
            d=fetch('https://open.er-api.com/v6/latest/USD')
            tr=d['rates']['TRY']
          except:
            tr=38.5

          now=time.gmtime(time.time()+3*3600)
          days=['الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت','الأحد']
          months=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر']

          h={'X-Master-Key':API_KEY}
          req=urllib.request.Request(f'{JSONBIN}/latest',headers=h)
          with urllib.request.urlopen(req,timeout=15) as r:
            cur=json.loads(r.read())['record']

          cur.update({
            'newSyp':round((sell/100)*10)/10,
            'oldSyp':sell,
            'tryRate':round(tr*100)/100,
            'trySyp':round((sell/tr/100)*100)/100,
            'buySyp':buy,
            'buyNewSyp':round((buy/100)*10)/10,
            'dateStr':f"{days[now.tm_wday]} {now.tm_mday} {months[now.tm_mon-1]} {now.tm_year}",
            'timeStr':f'{now.tm_hour:02d}:{now.tm_min:02d}',
            'source':'github-actions',
            'updatedAt':int(time.time()*1000)
          })

          body=json.dumps(cur).encode()
          req=urllib.request.Request(JSONBIN,data=body,method='PUT',
            headers={**h,'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=15) as r:
            print('تم!' if json.loads(r.read()) else 'خطأ')
          PYTHON
